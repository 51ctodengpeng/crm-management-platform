# ============================================================================
# 客户管理系统 CRM —— Nginx 反向代理配置
# 部署位置：/etc/nginx/conf.d/crm.conf
# 生效方式：nginx -t && systemctl reload nginx
#
# 拓扑：
#   浏览器 --443(HTTPS)--> Nginx --HTTP--> 127.0.0.1:5050 (Gunicorn/Flask)
#   证书：/ssl/powershell.com.cn.pem + .key（泛域名 *.powershell.com.cn，覆盖 crm 子域）
#   应用只监听回环地址，公网无法直连 5050
# ============================================================================

# 上游：应用进程组（keepalive 复用连接，减少 TIME_WAIT）
upstream crm_app {
    server 127.0.0.1:5050;
    keepalive 32;
}

# ---------- 80：一律跳 HTTPS（保留路径与查询串） ----------
server {
    listen 80;
    listen [::]:80;
    server_name crm.powershell.com.cn;

    # 证书续期 / ACME 校验留口子（当前用文件证书，保留以便日后换 Let's Encrypt）
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---------- 443：HTTPS 入口 ----------
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name crm.powershell.com.cn;

    # ---------- SSL 证书（存放在 /ssl 目录，与本站其它站点共用同一张泛域名证书） ----------
    ssl_certificate     /ssl/powershell.com.cn.pem;
    ssl_certificate_key /ssl/powershell.com.cn.key;

    ssl_session_timeout 10m;
    ssl_session_cache shared:SSL_CRM:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;

    # ---------- 请求体上限 ----------
    # 应用侧 MAX_CONTENT_LENGTH = 20MB（附件），这里放到 25MB：
    # 让超出 20MB 的请求进到应用、由应用给出中文提示，而不是被 Nginx 直接 413
    client_max_body_size 25m;
    client_body_timeout 120s;

    # ---------- 安全响应头（应用内也加，这里是第二道） ----------
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;
    add_header Strict-Transport-Security "max-age=31536000" always;

    # ---------- 日志 ----------
    access_log /var/log/nginx/crm.access.log;
    error_log  /var/log/nginx/crm.error.log warn;

    # ---------- 压缩 ----------
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript
               text/xml application/xml application/xml+rss image/svg+xml;

    # ---------- 静态资源：Nginx 直接读盘，不占应用进程 ----------
    # 对应 config.py 的 STATIC_FOLDER = /opt/crm/static
    location /static/ {
        alias /opt/crm/static/;
        expires 7d;
        access_log off;
        add_header Cache-Control "public";
        try_files $uri @crm_app;
    }

    # ---------- 上传目录只能走后端鉴权接口下载，禁止直接访问 ----------
    location ^~ /uploads/ {
        deny all;
        return 403;
    }
    location ^~ /avatars/ {
        deny all;
        return 403;
    }

    # ---------- 应用反向代理 ----------
    location / {
        proxy_pass http://crm_app;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Connection        "";

        proxy_redirect off;
        proxy_buffering off;          # Excel 导出 / 附件下载边生成边下发
        proxy_connect_timeout 30s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }

    location @crm_app {
        proxy_pass http://crm_app;
        proxy_set_header Host              $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 隐藏文件一律拒绝（.env / .git / .secret_key 等）
    location ~ /\. {
        deny all;
    }
}
