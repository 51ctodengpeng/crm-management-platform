{% extends "base.html" %}
{% block title %}{{ code }}{% endblock %}
{% block page_title %}出错了{% endblock %}
{% block content %}
<div class="card">
  <div class="card-body empty-state">
    <i class="bi bi-exclamation-triangle"></i>
    <h4 class="mb-2 num">{{ code }}</h4>
    <p class="mb-3">{{ msg }}</p>
    <div class="d-flex gap-2 justify-content-center">
      <a class="btn btn-primary btn-sm" href="{{ url_for('index') }}">返回首页</a>
      <a class="btn btn-light btn-sm" href="javascript:history.back()">返回上一页</a>
    </div>
  </div>
</div>
{% endblock %}
